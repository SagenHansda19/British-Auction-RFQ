# postgres + redis only, the app runs locally (see README)
name: rfq
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq
      POSTGRES_DB: rfq
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq -d rfq"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
