name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rfq
          POSTGRES_PASSWORD: rfq
          POSTGRES_DB: rfq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rfq -d rfq"
          --health-interval 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://rfq:rfq@localhost:5432/rfq
      TEST_DATABASE_URL: postgresql+psycopg://rfq:rfq@localhost:5432/rfq_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Create the test database
        run: PGPASSWORD=rfq psql -h localhost -U rfq -d rfq -c "CREATE DATABASE rfq_test"

      - name: Migrations
        run: uv run alembic upgrade head && uv run alembic check

      - name: Tests
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
